
name: Build Freedom AI Trader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find or extract project source
        shell: bash
        run: |
          set -e

          if [ ! -f package.json ]; then
            mkdir -p .github-build-source

            ZIP_FILE=$(find . -maxdepth 3 -type f \
              \( -iname '*Fixed*Source*.zip' -o -iname '*Starter*Source*.zip' \) \
              -print -quit)

            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting: $ZIP_FILE"
              unzip -oq "$ZIP_FILE" -d .github-build-source
            fi
          fi

          PROJECT_DIR=$(find . -type f -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/.expo/*' \
            -not -path '*/.github-build-source/node_modules/*' \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json not found."
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Verify project files
        run: |
          cd "$PROJECT_DIR"
          test -f package.json
          test -f app.json
          test -f App.tsx
          test -f src/market.ts
          test -f src/signals.ts

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install --no-audit --no-fund

      - name: Generate Android project
        run: |
          cd "$PROJECT_DIR"
          npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: freedom-ai-trader-release-apk
          path: '**/android/app/build/outputs/apk/release/app-release.apk'
          if-no-files-found: error
          retention-days: 14
